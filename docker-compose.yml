services:
  app:
    build: .
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "5001"
      GLOSSARY_DIR: /app/data
    volumes:
      # data/ is gitignored and not baked into the image (see Dockerfile) —
      # it holds sermon mode's glossary CSV/md files (server/lib/glossary-store.ts).
      # Mounted read-only: the container only ever reads these, never writes.
      - ./data:/app/data:ro
